services:
  - type: web
    name: reactiva-territorio
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      # SPA fallback: React Router maneja las rutas en el cliente, así que
      # cualquier ruta (/panel, /alertas, /reset-password, etc.) debe servir
      # index.html en vez de dar 404.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_USE_FIREBASE_EMULATORS
        value: "false"
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
